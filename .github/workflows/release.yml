name: 自动构建与发布

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置Java环境
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: 获取项目信息
        id: project-info
        run: |
          # 由 build.gradle 的 printProjectInfo 任务输出 name/version
          chmod +x gradlew
          ./gradlew -q --no-daemon --console=plain printProjectInfo | grep -E '^(name|version)=' >> "$GITHUB_OUTPUT"

      - name: Gradle构建项目
        run: ./gradlew --no-daemon --console=plain clean build

      - name: 验证构建结果
        run: |
          if [ ! -d "build/libs" ]; then
            echo "::error::构建失败，未生成build/libs目录"
            exit 1
          fi
          echo "=== 构建产物 ==="
          ls -lh build/libs/

      - name: 获取提交信息
        id: get-commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:%B)
          echo "commit_msg<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 计算文件哈希
        id: file-hashes
        run: |
          set -euo pipefail

          echo "## 📦 文件校验哈希" > hashes.md
          echo '```' >> hashes.md

          found_files=false
          for file in build/libs/*.jar; do
            if [[ -f "$file" ]]; then
              hash=$(sha256sum "$file" | awk '{print $1}')
              filename=$(basename "$file")
              echo "${filename}: ${hash}" >> hashes.md
              found_files=true
            fi
          done

          if [[ "$found_files" == false ]]; then
            echo "::warning::未找到可校验文件"
            echo "hash_content=未生成校验信息" >> $GITHUB_OUTPUT
          else
            echo '```' >> hashes.md
            echo "hash_content<<EOF" >> $GITHUB_OUTPUT
            cat hashes.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: 记录构建时间
        id: get-date
        run: |
          echo "date=$(date +'%Y年%m月%d日 %H时%M分%S秒')" >> $GITHUB_OUTPUT

      - name: 生成变更日志
        id: changelog
        env:
          COMMIT_MSG: ${{ steps.get-commit.outputs.commit_msg }}
          HASH_CONTENT: ${{ steps.file-hashes.outputs.hash_content }}
        run: |
          {
            echo "## 📝 提交信息"
            echo '```'
            echo "$COMMIT_MSG"
            echo '```'
            echo ''
            echo "## 🔧 构建详情"
            echo "- 项目名称: ${{ steps.project-info.outputs.name }}"
            echo "- 版本号: ${{ steps.project-info.outputs.version }}"
            echo "- 提交哈希: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "- 构建时间: ${{ steps.get-date.outputs.date }}"
            echo ''
            echo "## 🔍 文件校验"
            echo "$HASH_CONTENT"
            echo ''
            echo "> 本发布由 GitHub Actions 自动生成"
          } > changelog.md

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: 创建版本发布
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.project-info.outputs.version }}
          name: ${{ steps.project-info.outputs.name }}-v${{ steps.project-info.outputs.version }}
          body_path: changelog.md
          files: |
            build/libs/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传到 NexusMC
        uses: mcio-dev/upload-to-nexusmc@v1
        with:
          api_token: ${{ secrets.NEXUSMC_API_TOKEN }}
          resource_id: ${{ vars.NEXUSMC_RESOURCE_ID }}
          file_path: build/libs/CatSeedLogin-${{ steps.project-info.outputs.version }}.jar
          version: ${{ steps.project-info.outputs.version }}
          version_tag: releases
          version_title: Release ${{ steps.project-info.outputs.version }}
          changelog_markdown: ${{ steps.changelog.outputs.changelog }}
          publish_version: true
          operation: update
