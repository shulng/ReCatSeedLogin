name: CI Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Java
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: CatSeedLogin
          path: |
            build/libs/*.jar
